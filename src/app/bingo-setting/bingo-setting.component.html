<div class="container blue no-select setting-page">
  <div class="settings-card">
    <div class="settings-header">
      <h2>Instellingen</h2>
      <a class="icon-action" routerLink="" title="Home">
        <fa-icon [icon]="faHome" size="2x"></fa-icon>
      </a>
    </div>

    <div class="settings-section">
      <p class="section-title">Achtergrondkleur</p>
      <div class="color-grid">
        <button
          *ngFor="let color of colorOptions"
          type="button"
          class="color-swatch"
          [style.backgroundColor]="color"
          [class.selected]="bingoUser.backgroundColor === color"
          (click)="selectBackgroundColor(color)"
          [attr.aria-label]="'Selecteer kleur ' + color"
        ></button>
      </div>
    </div>

    <div class="settings-section">
      <p class="section-title">Trekkingsnummers</p>
      <div class="number-row">
        <label for="min">Min</label>
        <input id="min" class="input-number" type="number" [(ngModel)]="minimumNumber" min="0" max="90" />
        <label for="max">Max</label>
        <input id="max" class="input-number" type="number" [(ngModel)]="maximumNumber" min="1" max="100" />
      </div>
    </div>

    <div class="settings-section">
      <p class="section-title">Kaarttype</p>
      <div class="card-type-options">
        <button type="button" [class.active]="cardType === 'default'" (click)="cardType = 'default'">Standaard</button>
        <button type="button" [class.active]="cardType === 'random'" (click)="cardType = 'random'">Willekeurig</button>
        <button type="button" [class.active]="cardType === 'special'" (click)="cardType = 'special'">Speciaal</button>
      </div>
    </div>

    <div class="settings-section">
      <p class="section-title">Gebruikersnaam</p>
      <input class="input-username" type="text" [(ngModel)]="bingoUser.username" />
    </div>

    <div class="actions-row">
      <button class="save-button" type="button" (click)="saveAndReturn()">
        <fa-icon [icon]="faReturn" flip="horizontal"></fa-icon>
        OPSLAAN EN TERUG
      </button>
    </div>
  </div>
</div>
