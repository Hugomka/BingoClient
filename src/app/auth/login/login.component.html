<div class="login-container">
  <div class="login-card">
    <h1>Bingo Login</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Username field -->
      <div class="form-group">
        <label for="username">Gebruikersnaam</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Voer je gebruikersnaam in"
          class="form-control"
          [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
        />
        <small *ngIf="loginForm.get('username')?.hasError('required') && loginForm.get('username')?.touched" class="error">
          Gebruikersnaam is vereist
        </small>
        <small *ngIf="loginForm.get('username')?.hasError('minlength') && loginForm.get('username')?.touched" class="error">
          Gebruikersnaam moet minstens 2 karakters bevatten
        </small>
      </div>

      <!-- Password field -->
      <div class="form-group">
        <label for="password">Wachtwoord</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Voer je wachtwoord in"
          class="form-control"
          [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
        <small *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched" class="error">
          Wachtwoord is vereist
        </small>
      </div>

      <!-- Error message -->
      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <!-- Submit button -->
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loginForm.invalid || isLoading"
      >
        {{ isLoading ? 'Inloggen...' : 'Inloggen' }}
      </button>
    </form>

    <!-- Stub login buttons for offline development -->
    <div class="stub-section">
      <p><small>Voor offline testen (tot BingoServer klaar is):</small></p>
      <div class="stub-buttons">
        <button class="btn btn-secondary" (click)="stubLogin('TestSpeler1')">
          Test als Speler 1
        </button>
        <button class="btn btn-secondary" (click)="stubLogin('TestSpeler2')">
          Test als Speler 2
        </button>
      </div>
    </div>
  </div>
</div>
